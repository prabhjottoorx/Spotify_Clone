<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Password - BeatBox</title>
<link rel="stylesheet" href="auth.css" />
<link rel="icon" type="image/svg+xml" href="logo.svg" />
</head>
<body class="auth-base">
<main class="a-page">
  <a href="index.html" aria-label="BeatBox home"><img class="a-logo" src="logo.svg" alt="" width="44" height="44" /></a>
  <p class="a-step">Step 1 of 3</p>
  <h1>Create a password</h1>
  <form id="f" novalidate>
    <div class="a-group">
      <label class="a-label" for="pw">Password</label>
      <div class="a-pw"><input class="a-input" id="pw" type="password" autocomplete="new-password" /><button type="button" class="a-eye" aria-label="Show password" data-eye><i>👁</i></button></div>
      <p class="a-hint">Your password must contain at least:</p>
      <ul class="a-rules" id="rules">
        <li data-r="letter">1 letter</li>
        <li data-r="numsym">1 number or special character (example: # ? ! &amp;)</li>
        <li data-r="len">8 characters</li>
      </ul>
      <div class="a-err" id="err" role="alert"></div>
    </div>
    <button class="a-btn" type="submit">Next</button>
  </form>
</main>
<script src="auth.js"></script>
<script>
document.querySelectorAll("[data-eye]").forEach((b) => b.addEventListener("click", () => {
  const input = b.parentElement.querySelector("input");
  const show = input.type === "password";
  input.type = show ? "text" : "password";
  b.setAttribute("aria-label", show ? "Hide password" : "Show password");
  b.firstElementChild.textContent = show ? "🙈" : "👁";
}));
const data = JSON.parse(sessionStorage.getItem("beatboxSignup") || "null");
if (!data || !data.email) location.replace("signup.html");
const pw = document.getElementById("pw"), err = document.getElementById("err");
pw.focus();
function check() {
  const c = Auth.checkPassword(pw.value);
  document.querySelectorAll("#rules li").forEach((li) => li.classList.toggle("ok", c[li.dataset.r]));
  return Auth.passwordOk(pw.value);
}
pw.addEventListener("input", () => { check(); err.classList.remove("show"); pw.classList.remove("bad"); });
document.getElementById("f").addEventListener("submit", (e) => {
  e.preventDefault();
  if (!check()) { err.textContent = "Please make your password match all the rules above."; err.classList.add("show"); pw.classList.add("bad"); return; }
  data.password = pw.value;
  sessionStorage.setItem("beatboxSignup", JSON.stringify(data));
  location.href = "signup-profile.html";
});
</script>
</body>
</html>
