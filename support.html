<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeatBox Support</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #ffffff;
            color: #000000;
        }

        /* Navbar */
        .navbar {
            height: 72px;
            background: #000000;
            display: flex;
            align-items: center;
            padding: 0 45px;
            color: white;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: bold;
        }

        .beatbox-icon {
            width: 34px;
            height: 34px;
            background: #1DB954;
            border-radius: 50%;
            position: relative;
        }

        .beatbox-icon::before {
            content: "";
            position: absolute;
            width: 20px;
            height: 6px;
            border-top: 2px solid #000;
            border-radius: 50%;
            top: 10px;
            left: 7px;
            transform: rotate(5deg);
        }

        .beatbox-icon::after {
            content: "";
            position: absolute;
            width: 16px;
            height: 5px;
            border-top: 2px solid #000;
            border-radius: 50%;
            top: 17px;
            left: 9px;
        }

        .nav-links {
            display: flex;
            gap: 35px;
            margin-left: auto;
            align-items: center;
        }

        .nav-links a,
        .right-nav a {
            color: white;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
        }

        .nav-links a:hover,
        .right-nav a:hover {
            color: #1DB954;
        }

        .right-nav {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-left: 35px;
        }

        .globe {
            width: 18px;
            height: 18px;
            border: 2px solid white;
            border-radius: 50%;
        }

        .login-btn {
            background: white;
            color: black !important;
            padding: 12px 22px;
            border-radius: 25px;
        }

        .login-btn:hover {
            background: #1DB954;
            color: black !important;
        }

        /* Main */
        main {
            text-align: center;
        }

        .hero {
            background: #121212;
            color: white;
            padding: 70px 20px 80px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 35px;
        }

        /* Search */
        .search-container {
            width: 650px;
            max-width: 100%;
            margin: auto;
        }

        .search-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 5px;
            padding: 6px;
            text-align: left;
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            padding: 16px;
            font-size: 16px;
        }

        .ask-btn {
            background: #1DB954;
            color: black;
            border: none;
            padding: 14px 28px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .ask-btn:hover {
            transform: scale(1.04);
        }

        .ai-text {
            color: #B3B3B3;
            margin-top: 15px;
            font-size: 14px;
        }

        /* Help Section */
        .help-section {
            max-width: 900px;
            margin: 0 auto;
            padding: 65px 20px;
            text-align: left;
        }

        .help-section h2 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 35px;
        }

        .category {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 25px;
            border-bottom: 1px solid #dddddd;
            cursor: pointer;
            transition: 0.2s;
        }

        .category:hover {
            background: #f5f5f5;
            padding-left: 32px;
        }

        .category h3 {
            font-size: 18px;
        }

        .arrow {
            font-size: 24px;
            font-weight: bold;
        }

        /* Footer */
        footer {
            background: #000000;
            color: #B3B3B3;
            text-align: center;
            padding: 35px 20px;
            margin-top: 30px;
        }

        footer strong {
            color: white;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                padding: 0 20px;
            }

            .nav-links {
                display: none;
            }

            .right-nav {
                margin-left: auto;
                gap: 15px;
            }

            .right-nav .globe {
                display: none;
            }

            .hero h1 {
                font-size: 36px;
            }

            .search-container {
                width: 100%;
            }

            .search-box {
                flex-direction: column;
                gap: 10px;
                padding: 10px;
            }

            .search-box input {
                width: 100%;
            }

            .ask-btn {
                width: 100%;
            }

            .help-section {
                padding: 45px 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            <div class="logo">🎧</div>
            <span>BeatBox</span>
        </div>

        <div class="nav-links">
            <a href="#">Explore Premium</a>
            <a href="#">Install App</a>
        </div>

        <div class="right-nav">
            <div class="globe"></div>
            <a href="#">Sign up</a>
            <a href="#" class="login-btn">Log in</a>
        </div>

    </nav>


    <!-- Hero -->
    <section class="hero">

        <h1>BeatBox Support</h1>

        <div class="search-container">

            <div class="search-title">
                What can I help with?
            </div>

            <div class="search-box">
                <input
                    type="text"
                    placeholder="Search for help"
                >

                <button class="ask-btn">
                    Ask
                </button>
            </div>

            <p class="ai-text">
                Answers powered by AI
            </p>

        </div>

    </section>


    <!-- Help Articles -->
    <section class="help-section">

        <h2>Browse help articles</h2>

        <div class="category">
            <h3>Payments & billing</h3>
            <span class="arrow">›</span>
        </div>

        <div class="category">
            <h3>Manage your account</h3>
            <span class="arrow">›</span>
        </div>

        <div class="category">
            <h3>Premium plans</h3>
            <span class="arrow">›</span>
        </div>

        <div class="category">
            <h3>In-app features</h3>
            <span class="arrow">›</span>
        </div>

        <div class="category">
            <h3>Devices & troubleshooting</h3>
            <span class="arrow">›</span>
        </div>

    </section>


    <!-- Footer -->
    <footer>
        <strong>BeatBox Support</strong>
        <br><br>
        © 2026 BeatBox Support Clone
    </footer>

</body>
</html>
