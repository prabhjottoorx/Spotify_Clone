<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign up to BeatBox</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #121212;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        /* Main container */
        .signup-page {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            padding: 110px 20px 60px;
        }

        /* BeatBox logo */
        .beatbox-logo {
            width: 38px;
            height: 38px;
            background: #ffffff;
            border-radius: 50%;
            margin: 0 auto 25px;
            position: relative;
        }

        .beatbox-logo::before {
            content: "";
            position: absolute;
            width: 23px;
            height: 8px;
            border-top: 3px solid #121212;
            border-radius: 50%;
            top: 11px;
            left: 7px;
            transform: rotate(4deg);
        }

        .beatbox-logo::after {
            content: "";
            position: absolute;
            width: 19px;
            height: 7px;
            border-top: 3px solid #121212;
            border-radius: 50%;
            top: 18px;
            left: 9px;
            transform: rotate(4deg);
        }

        /* Heading */
        h1 {
            text-align: center;
            font-size: 42px;
            line-height: 1.12;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 48px;
        }

        /* Form */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .email-input {
            width: 100%;
            height: 57px;
            padding: 0 14px;
            background: #121212;
            color: #ffffff;
            border: 1px solid #727272;
            border-radius: 4px;
            font-size: 17px;
            outline: none;
        }

        .email-input::placeholder {
            color: #b3b3b3;
        }

        .email-input:focus {
            border: 2px solid #ffffff;
        }

        /* Next button */
        .next-btn {
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 30px;
            background: #1ed760;
            color: #000000;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 2px;
            transition: transform 0.15s ease;
        }

        .next-btn:hover {
            background: #1fdf64;
            transform: scale(1.02);
        }

        /* OR */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 26px 0 20px;
        }

        .divider span {
            font-size: 16px;
            font-weight: 600;
        }

        /* Social buttons */
        .social-btn {
            width: 100%;
            height: 58px;
            background: transparent;
            color: #ffffff;
            border: 1px solid #727272;
            border-radius: 30px;
            margin-bottom: 10px;
            cursor: pointer;

            display: flex;
            align-items: center;
            position: relative;

            font-size: 16px;
            font-weight: 700;

            transition: border-color 0.2s ease,
                        transform 0.15s ease;
        }

        .social-btn:hover {
            border-color: #ffffff;
            transform: scale(1.01);
        }

        /* Icons */
        .icon {
            position: absolute;
            left: 31px;
            width: 25px;
            text-align: center;
            font-size: 22px;
        }

        .phone-icon {
            font-size: 22px;
        }

        .google-icon {
            font-size: 21px;
            font-weight: 700;
            color: #4285f4;
        }

        .apple-icon {
            font-size: 24px;
            color: #ffffff;
        }

        .button-text {
            width: 100%;
            text-align: center;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .signup-page {
                padding-top: 60px;
                max-width: 420px;
            }

            h1 {
                font-size: 34px;
                margin-bottom: 38px;
            }

            .beatbox-logo {
                margin-bottom: 22px;
            }
        }

        @media (max-width: 350px) {

            .signup-page {
                padding-left: 15px;
                padding-right: 15px;
            }

            h1 {
                font-size: 30px;
            }

            .social-btn {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <main class="signup-page">

        <!-- BeatBox Logo -->
        <div class="Beatbox-logo"></div>


        <!-- Heading -->
        <h1>
            Sign up to<br>
            start listening
        </h1>


        <!-- Email -->
        <div class="form-group">

            <label for="email">
                Email address
            </label>

            <input
                type="email"
                id="email"
                class="email-input"
            >

        </div>


        <!-- Next -->
        <button class="next-btn">
            Next
        </button>


        <!-- OR -->
        <div class="divider">
            <span>or</span>
        </div>


        <!-- Phone -->
        <button class="social-btn">

            <span class="icon phone-icon">▯</span>

            <span class="button-text">
                Sign up with phone number
            </span>

        </button>


        <!-- Google -->
        <button class="social-btn">

            <span class="icon google-icon">G</span>

            <span class="button-text">
                Sign up with Google
            </span>

        </button>


        <!-- Apple -->
        <button class="social-btn">

            <span class="icon apple-icon">●</span>

            <span class="button-text">
                Sign up with Apple
            </span>

        </button>

    </main>

</body>
</html>
