<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password - BeatBox</title>
<link rel="stylesheet" href="auth.css" />
<link rel="icon" type="image/svg+xml" href="logo.svg" />
</head>
<body class="auth-base">
<main class="a-page">
  <a href="index.html" aria-label="BeatBox home"><img class="a-logo" src="logo.svg" alt="" width="44" height="44" /></a>
  <h1>Reset your password</h1>
  <div id="step1">
    <p class="a-sub">Enter the email you used to sign up.</p>
    <form id="f1" novalidate>
      <div class="a-group">
        <label class="a-label" for="em">Email address</label>
        <input class="a-input" id="em" type="email" autocomplete="email" />
        <div class="a-err" id="e1" role="alert"></div>
      </div>
      <button class="a-btn" type="submit">Continue</button>
    </form>
  </div>
  <div id="step2" hidden>
    <p class="a-sub">Demo mode: a real site would email you a link. Here you can choose a new password right away.</p>
    <form id="f2" novalidate>
      <div class="a-group">
        <label class="a-label" for="np">New password</label>
        <div class="a-pw"><input class="a-input" id="np" type="password" autocomplete="new-password" /><button type="button" class="a-eye" aria-label="Show password" data-eye><i>👁</i></button></div>
        <ul class="a-rules" id="rules">
          <li data-r="letter">1 letter</li>
          <li data-r="numsym">1 number or special character</li>
          <li data-r="len">8 characters</li>
        </ul>
        <div class="a-err" id="e2" role="alert"></div>
      </div>
      <button class="a-btn" type="submit">Save new password</button>
    </form>
  </div>
  <div id="done" hidden>
    <p class="a-ok show">Your password has been changed.</p>
    <a class="a-btn" id="goLogin" href="login.html" style="display:flex;align-items:center;justify-content:center;text-decoration:none">Log in</a>
  </div>
  <a class="a-link" href="login.html">Back to log in</a>
</main>
<script src="auth.js"></script>
<script>
document.querySelectorAll("[data-eye]").forEach((b) => b.addEventListener("click", () => {
  const input = b.parentElement.querySelector("input");
  const show = input.type === "password";
  input.type = show ? "text" : "password";
  b.setAttribute("aria-label", show ? "Hide password" : "Show password");
  b.firstElementChild.textContent = show ? "🙈" : "👁";
}));
const $ = (id) => document.getElementById(id);
let email = new URLSearchParams(location.search).get("email") || "";
$("em").value = email;
$("f1").addEventListener("submit", (e) => {
  e.preventDefault();
  email = $("em").value.trim();
  const e1 = $("e1");
  if (!Auth.validEmail(email)) { e1.textContent = "Enter a valid email address."; e1.classList.add("show"); return; }
  if (!Auth.exists(email)) { e1.textContent = "We couldn’t find an account with that email."; e1.classList.add("show"); return; }
  $("step1").hidden = true; $("step2").hidden = false; $("np").focus();
});
const np = $("np");
np.addEventListener("input", () => {
  const c = Auth.checkPassword(np.value);
  document.querySelectorAll("#rules li").forEach((li) => li.classList.toggle("ok", c[li.dataset.r]));
  $("e2").classList.remove("show");
});
$("f2").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!Auth.passwordOk(np.value)) { $("e2").textContent = "Please make your password match all the rules."; $("e2").classList.add("show"); return; }
  await Auth.resetPassword(email, np.value);
  $("step2").hidden = true; $("done").hidden = false;
  $("goLogin").href = "login-password.html?email=" + encodeURIComponent(email);
});
</script>
</body>
</html>
