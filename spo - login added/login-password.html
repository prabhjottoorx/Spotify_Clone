<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in - BeatBox</title>
<link rel="stylesheet" href="auth.css" />
<link rel="icon" type="image/svg+xml" href="logo.svg" />
</head>
<body class="auth-base">
<main class="a-page">
  <a href="index.html" aria-label="BeatBox home"><img class="a-logo" src="logo.svg" alt="" width="44" height="44" /></a>
  <h1>Enter your password</h1>
  <p class="a-sub" id="who"></p>
  <form id="f" novalidate>
    <div class="a-group">
      <label class="a-label" for="pw">Password</label>
      <div class="a-pw"><input class="a-input" id="pw" type="password" autocomplete="current-password" /><button type="button" class="a-eye" aria-label="Show password" data-eye><i>👁</i></button></div>
      <div class="a-err" id="err" role="alert"></div>
    </div>
    <button class="a-btn" type="submit" id="go">Log in</button>
  </form>
  <a class="a-link" href="forgot-password.html" id="forgot">Forgot your password?</a>
  <a class="a-link" href="login.html" style="margin-top:14px;font-weight:400">Use a different email</a>
</main>
<script src="auth.js"></script>
<script>
document.querySelectorAll("[data-eye]").forEach((b) => b.addEventListener("click", () => {
  const input = b.parentElement.querySelector("input");
  const show = input.type === "password";
  input.type = show ? "text" : "password";
  b.setAttribute("aria-label", show ? "Hide password" : "Show password");
  b.firstElementChild.textContent = show ? "🙈" : "👁";
}));
const email = new URLSearchParams(location.search).get("email") || "";
if (!email) location.replace("login.html");
document.getElementById("who").textContent = "Logging in as " + email;
document.getElementById("forgot").href = "forgot-password.html?email=" + encodeURIComponent(email);
const pw = document.getElementById("pw"), err = document.getElementById("err"), go = document.getElementById("go");
pw.focus();
pw.addEventListener("input", () => { err.classList.remove("show"); pw.classList.remove("bad"); });
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!pw.value) { err.textContent = "Please enter your password."; err.classList.add("show"); pw.classList.add("bad"); return; }
  go.disabled = true;
  const r = await Auth.login(email, pw.value);
  go.disabled = false;
  if (r === "ok") { location.href = Auth.next(); return; }
  pw.classList.add("bad");
  err.textContent = r === "locked" ? "Too many tries. Please wait 30 seconds and try again." : "Incorrect username or password.";
  err.classList.add("show");
});
</script>
</body>
</html>
